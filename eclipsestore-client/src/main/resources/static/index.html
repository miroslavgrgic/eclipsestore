<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hotel Data Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.9/standalone/umd/vis-network.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <div class="brand">
      <svg class="logo-badge" width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hotel Data Assistant logo">
        <defs>
          <linearGradient id="logoGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#6366f1"/>
            <stop offset="55%" stop-color="#a855f7"/>
            <stop offset="100%" stop-color="#ec4899"/>
          </linearGradient>
        </defs>
        <rect width="64" height="64" rx="18" fill="url(#logoGrad)"/>
        <path d="M32 14c-8.3 0-15 6.7-15 15v7.5l-4.5 7.5h39l-4.5-7.5V29c0-8.3-6.7-15-15-15z" fill="#ffffff"/>
        <circle cx="32" cy="11" r="3" fill="#ffffff"/>
        <circle cx="32" cy="47" r="3" fill="#ffffff"/>
        <path d="M50 6l1.8 4.9 4.9 1.8-4.9 1.8L50 19.4l-1.8-4.9-4.9-1.8 4.9-1.8z" fill="#fde68a"/>
      </svg>
      <h1 class="brand-title">Hotel Data Assistant</h1>
      <p class="brand-subtitle">MCP Client</p>
    </div>

    <div class="app">
      <header>
        <p>Ask questions about bookings &mdash; e.g. "Which 3 bookings in April 2026 had the most guests?"</p>
      </header>
      <div id="messages"></div>
      <form id="chat-form">
        <input type="text" id="chat-input" placeholder="Ask about bookings..." autocomplete="off" autofocus />
        <button type="submit" id="chat-submit">Send</button>
      </form>
      <details id="tools-panel">
        <summary>Available MCP tools</summary>
        <div id="tools-list"></div>
      </details>
      <details id="graph-panel">
        <summary>Data graph</summary>
        <div id="graph-legend"></div>
        <div id="graph-container"></div>
        <div id="graph-empty"></div>
      </details>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
