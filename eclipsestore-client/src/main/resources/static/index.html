<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hotel Booking Assistant</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f5f7;
      --panel: #ffffff;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --accent: #0071e3;
      --bubble-user: #0071e3;
      --bubble-user-text: #ffffff;
      --bubble-bot: #e9e9eb;
      --bubble-bot-text: #1d1d1f;
      --border: #d2d2d7;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1e;
        --panel: #2c2c2e;
        --text: #f5f5f7;
        --muted: #a1a1a6;
        --bubble-bot: #3a3a3c;
        --bubble-bot-text: #f5f5f7;
        --border: #48484a;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .app {
      width: min(680px, 100vw);
      height: min(820px, 100vh);
      background: var(--panel);
      border-radius: 16px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }
    header h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 600;
    }
    header p {
      margin: 2px 0 0;
      font-size: 13px;
      color: var(--muted);
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 16px;
      line-height: 1.4;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--bubble-user);
      color: var(--bubble-user-text);
      border-bottom-right-radius: 4px;
    }
    .msg.bot {
      align-self: flex-start;
      background: var(--bubble-bot);
      color: var(--bubble-bot-text);
      border-bottom-left-radius: 4px;
    }
    .msg.error {
      align-self: flex-start;
      background: #ffe5e5;
      color: #b3261e;
    }
    .msg.pending {
      align-self: flex-start;
      color: var(--muted);
      font-style: italic;
    }
    form {
      display: flex;
      gap: 10px;
      padding: 16px;
      border-top: 1px solid var(--border);
    }
    input[type="text"] {
      flex: 1;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
    }
    input[type="text"]:focus {
      outline: 2px solid var(--accent);
    }
    button {
      padding: 0 18px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.5;
      cursor: default;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Hotel Booking Assistant</h1>
      <p>Ask questions about bookings &mdash; e.g. "Which 3 bookings in April 2026 had the most guests?"</p>
    </header>
    <div id="messages"></div>
    <form id="chat-form">
      <input type="text" id="chat-input" placeholder="Ask about bookings..." autocomplete="off" autofocus />
      <button type="submit" id="chat-submit">Send</button>
    </form>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const formEl = document.getElementById('chat-form');
    const inputEl = document.getElementById('chat-input');
    const submitEl = document.getElementById('chat-submit');

    function addMessage(text, className) {
      const el = document.createElement('div');
      el.className = 'msg ' + className;
      el.textContent = text;
      messagesEl.appendChild(el);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return el;
    }

    formEl.addEventListener('submit', async (event) => {
      event.preventDefault();
      const message = inputEl.value.trim();
      if (!message) return;

      addMessage(message, 'user');
      inputEl.value = '';
      inputEl.disabled = true;
      submitEl.disabled = true;

      const pending = addMessage('Thinking...', 'pending');

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message })
        });

        if (!response.ok) {
          throw new Error('Request failed with status ' + response.status);
        }

        const data = await response.json();
        pending.remove();
        addMessage(data.reply, 'bot');
      } catch (err) {
        pending.remove();
        addMessage('Something went wrong: ' + err.message, 'error');
      } finally {
        inputEl.disabled = false;
        submitEl.disabled = false;
        inputEl.focus();
      }
    });
  </script>
</body>
</html>
