server:
  port: 8081

spring:
  application:
    name: eclipsestore-client
  ai:
    mcp:
      client:
        name: eclipsestore-mcp-client
        streamable-http:
          connections:
            sb-hotel:
              url: http://localhost:8080
    model:
      # active chat provider: anthropic | openai
      chat: ${AI_CHAT_PROVIDER:anthropic}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        #model: claude-sonnet-5-5 claude-opus-4-6 ... 4-8 ... 5
        model: claude-haiku-4-5
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        # model: gpt-5.4-mini
        model: gpt-4.1-mini
