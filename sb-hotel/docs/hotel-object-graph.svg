<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" width="1600" height="760" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="ref" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E8590C"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1600" height="760" fill="#FFFFFF"/>

  <!-- ownership edges: Hotel -> collections -->
  <g fill="none" stroke="#64748B" stroke-width="2.5">
    <path d="M800 110 C800 160, 230 150, 230 200"/>
    <path d="M800 110 C800 160, 610 150, 610 200"/>
    <path d="M800 110 C800 160, 990 150, 990 200"/>
    <path d="M800 110 C800 160, 1370 150, 1370 200"/>
  </g>

  <!-- ownership edges: collections -> instances -->
  <g fill="none" stroke="#64748B" stroke-width="2.5">
    <path d="M230 262 L147 330"/>
    <path d="M230 262 L313 330"/>
    <path d="M610 262 L527 330"/>
    <path d="M610 262 L693 330"/>
    <path d="M990 262 L990 330"/>
    <path d="M1370 262 L1370 330"/>
    <!-- guest -> address -->
    <path d="M527 420 L527 470"/>
    <path d="M693 420 L693 470"/>
  </g>

  <!-- Hotel root -->
  <g filter="url(#shadow)">
    <rect x="670" y="36" width="260" height="76" rx="14" fill="#1F2A44"/>
  </g>
  <text x="800" y="70" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">Hotel</text>
  <text x="800" y="96" text-anchor="middle" font-size="15" fill="#CBD5E1">Root Object</text>

  <!-- Collections -->
  <g font-size="20" font-weight="600" fill="#1E293B" text-anchor="middle">
    <rect x="90" y="200" width="280" height="62" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="230" y="226">rooms</text>
    <rect x="470" y="200" width="280" height="62" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="610" y="226">guests</text>
    <rect x="850" y="200" width="280" height="62" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="990" y="226">bookings</text>
    <rect x="1230" y="200" width="280" height="62" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="1370" y="226">payments</text>
  </g>
  <g font-size="15" fill="#475569" text-anchor="middle" font-family="Consolas, Menlo, monospace">
    <text x="230" y="249">List&lt;Room&gt;</text>
    <text x="610" y="249">List&lt;Guest&gt;</text>
    <text x="990" y="249">List&lt;Booking&gt;</text>
    <text x="1370" y="249">List&lt;Payment&gt;</text>
  </g>
  <!-- collection badges -->
  <g font-size="13" font-weight="600" text-anchor="middle">
      <!--<rect x="690" y="186" width="74" height="24" rx="12" fill="#7C3AED"/>
      <text x="727" y="203" fill="#FFFFFF">indexed</text>-->
      <rect x="1420" y="186" width="80" height="24" rx="12" fill="#0F766E"/>
      <text x="1460" y="203" fill="#FFFFFF">lazy</text>
  </g>

  <!-- Instances -->
  <g filter="url(#shadow)">
    <!-- Rooms -->
    <rect x="72"  y="330" width="150" height="90" rx="10" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
    <rect x="238" y="330" width="150" height="90" rx="10" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
    <!-- Guests -->
    <rect x="452" y="330" width="150" height="90" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="618" y="330" width="150" height="90" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <!-- Booking -->
    <rect x="900" y="330" width="180" height="90" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <!-- Payment -->
    <rect x="1280" y="330" width="180" height="90" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
    <!-- Addresses -->
    <rect x="467" y="470" width="120" height="54" rx="9" fill="#F5F3FF" stroke="#A78BFA" stroke-width="1.5"/>
    <rect x="633" y="470" width="120" height="54" rx="9" fill="#F5F3FF" stroke="#A78BFA" stroke-width="1.5"/>
  </g>

  <g text-anchor="middle">
    <g font-size="18" font-weight="700">
      <text x="147"  y="358" fill="#075985">Room</text>
      <text x="313"  y="358" fill="#075985">Room</text>
      <text x="527"  y="358" fill="#5B21B6">Guest</text>
      <text x="693"  y="358" fill="#5B21B6">Guest</text>
      <text x="990"  y="358" fill="#92400E">Booking</text>
      <text x="1370" y="358" fill="#166534">Payment</text>
      <text x="527"  y="493" font-size="15" fill="#5B21B6">Address</text>
      <text x="693"  y="493" font-size="15" fill="#5B21B6">Address</text>
    </g>
    <g font-size="14" fill="#334155">
      <text x="147" y="383">Standard 101</text>
      <text x="147" y="403">24 m² · FREE</text>
      <text x="313" y="383">Suite 102</text>
      <text x="313" y="403">42 m² · BOOKED</text>
      <text x="527" y="383">Ana Horvat</text>
      <text x="527" y="403">age 34</text>
      <text x="693" y="383">Ben Weber</text>
      <text x="693" y="403">age 41 · booker</text>
      <text x="990" y="383">12 – 15 Oct</text>
      <text x="990" y="403">€ 540 · PAID</text>
      <text x="1370" y="383">provider px-7731</text>
      <text x="1370" y="403">10 Oct 2026</text>
      <text x="527" y="513" font-size="13">Zagreb</text>
      <text x="693" y="513" font-size="13">Munich</text>
    </g>
  </g>

  <!-- Object references (dashed) -->
  <g fill="none" stroke="#E8590C" stroke-width="2.5" stroke-dasharray="9 6">
    <!-- Payment -> Booking -->
    <path d="M1280 375 L1082 375" marker-end="url(#ref)"/>
    <!-- Booking -> Guest (Ben) -->
    <path d="M900 375 L770 375" marker-end="url(#ref)"/>
    <!-- Booking -> Guest (Ana): above the instance row -->
    <path d="M940 330 C940 296, 900 296, 860 296 L640 296 C600 296, 560 300, 560 328" marker-end="url(#ref)"/>
    <!-- Booking -> Room (Suite 102): routed below -->
    <path d="M990 420 L990 560 Q990 580 970 580 L333 580 Q313 580 313 560 L313 422" marker-end="url(#ref)"/>
  </g>
  <rect x="520" y="566" width="330" height="28" rx="6" fill="#FFFFFF"/>
  <text x="685" y="586" text-anchor="middle" font-size="16" font-style="italic" fill="#C2410C">same object in memory — no foreign key, no join</text>

  <!-- Legend -->
  <g font-size="16" fill="#334155">
    <line x1="470" y1="680" x2="530" y2="680" stroke="#64748B" stroke-width="2.5"/>
    <text x="542" y="686">contains</text>
    <line x1="660" y1="680" x2="720" y2="680" stroke="#E8590C" stroke-width="2.5" stroke-dasharray="9 6" marker-end="url(#ref)"/>
    <text x="732" y="686">references</text>
    <rect x="880" y="668" width="60" height="24" rx="6" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="952" y="686">loaded on demand</text>
  </g>
</svg>
